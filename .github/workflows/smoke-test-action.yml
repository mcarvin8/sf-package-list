# Manual smoke test: exercises the Action end to end (both mode: to-list and
# mode: to-xml) on real GitHub Actions infra using the repo's own
# test/samples fixtures.
#
# Two sources, deliberately not the same:
# - pull_request: uses `./` (this checkout's actual action.yml/dist/action) -
#   validates what's about to be merged before it ever reaches @v3.
# - workflow_dispatch: uses `@v3` (the live published tag) - an on-demand
#   check that what's actually public still works, run manually post-release.
name: Smoke test (published Action)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/smoke-test-action.yml'
      - 'action.yml'
      - 'dist/action/**'
      - 'src/action/**'
      - 'src/core/**'
      - 'src/utils/**'

permissions:
  contents: read

jobs:
  to-list-success-path-local:
    name: to-list success path (local checkout)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Convert package.xml to a list
        id: to-list
        uses: ./
        with:
          mode: to-list
          package-xml: test/samples/package-basic.xml
          package-list: package.txt

      - name: Show outputs and report
        run: |
          echo "package-list-path: ${{ steps.to-list.outputs.package-list-path }}"
          echo "types: ${{ steps.to-list.outputs.types }}"
          echo "members: ${{ steps.to-list.outputs.members }}"
          echo "---"
          cat package.txt

  to-list-fail-on-empty-local:
    name: to-list fail-on-empty failure path (local checkout)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Convert package.xml to a list (expected to fail on an empty result)
        id: to-list
        continue-on-error: true
        uses: ./
        with:
          mode: to-list
          package-xml: test/samples/package-no-types.xml
          package-list: package.txt
          fail-on-empty: 'true'

      - name: Confirm the step actually failed
        run: |
          if [ "${{ steps.to-list.outcome }}" != "failure" ]; then
            echo "Expected the fail-on-empty step to fail (outcome was '${{ steps.to-list.outcome }}')."
            exit 1
          fi
          echo "Confirmed: fail-on-empty correctly failed the step."

  to-xml-success-path-local:
    name: to-xml success path (local checkout)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Convert a list to package.xml
        id: to-xml
        uses: ./
        with:
          mode: to-xml
          package-list: test/samples/list-basic.txt
          package-xml: package.xml

      - name: Show outputs and report
        run: |
          echo "package-xml-path: ${{ steps.to-xml.outputs.package-xml-path }}"
          echo "types: ${{ steps.to-xml.outputs.types }}"
          echo "members: ${{ steps.to-xml.outputs.members }}"
          echo "api-version: ${{ steps.to-xml.outputs.api-version }}"
          echo "---"
          cat package.xml

  to-xml-fail-on-empty-local:
    name: to-xml fail-on-empty failure path (local checkout)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Convert a list to package.xml (expected to fail on an empty result)
        id: to-xml
        continue-on-error: true
        uses: ./
        with:
          mode: to-xml
          package-list: test/samples/invalid-list.txt
          package-xml: package.xml
          fail-on-empty: 'true'

      - name: Confirm the step actually failed
        run: |
          if [ "${{ steps.to-xml.outcome }}" != "failure" ]; then
            echo "Expected the fail-on-empty step to fail (outcome was '${{ steps.to-xml.outcome }}')."
            exit 1
          fi
          echo "Confirmed: fail-on-empty correctly failed the step."

      - name: Confirm outputs are still set despite the failure
        run: |
          if [ -z "${{ steps.to-xml.outputs.warnings }}" ]; then
            echo "Expected warnings to still be set on a fail-on-empty failure."
            exit 1
          fi
          echo "warnings: ${{ steps.to-xml.outputs.warnings }}"

  invalid-mode-failure-path-local:
    name: invalid mode failure path (local checkout)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run with an invalid mode (expected to fail)
        id: invalid-mode
        continue-on-error: true
        uses: ./
        with:
          mode: bogus

      - name: Confirm the step actually failed
        run: |
          if [ "${{ steps.invalid-mode.outcome }}" != "failure" ]; then
            echo "Expected the invalid-mode step to fail (outcome was '${{ steps.invalid-mode.outcome }}')."
            exit 1
          fi
          echo "Confirmed: an invalid mode correctly failed the step."

  to-list-success-path-published:
    name: to-list success path (published @v3)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Convert package.xml to a list
        id: to-list
        uses: mcarvin8/sf-package-list@v3
        with:
          mode: to-list
          package-xml: test/samples/package-basic.xml
          package-list: package.txt

      - name: Show outputs and report
        run: |
          echo "package-list-path: ${{ steps.to-list.outputs.package-list-path }}"
          echo "types: ${{ steps.to-list.outputs.types }}"
          echo "members: ${{ steps.to-list.outputs.members }}"
          echo "---"
          cat package.txt

  to-xml-success-path-published:
    name: to-xml success path (published @v3)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Convert a list to package.xml
        id: to-xml
        uses: mcarvin8/sf-package-list@v3
        with:
          mode: to-xml
          package-list: test/samples/list-basic.txt
          package-xml: package.xml

      - name: Show outputs and report
        run: |
          echo "package-xml-path: ${{ steps.to-xml.outputs.package-xml-path }}"
          echo "types: ${{ steps.to-xml.outputs.types }}"
          echo "members: ${{ steps.to-xml.outputs.members }}"
          echo "api-version: ${{ steps.to-xml.outputs.api-version }}"
          echo "---"
          cat package.xml
